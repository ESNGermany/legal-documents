name: Markdown to PDF with pandoc

on:
  push:
    branches: [ master ]
    paths:
      - '**.md'
  workflow_dispatch:   

jobs:
  md-to-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Remove old versions
        run: rm -f html/* pdf/*
        
      - name: Build the pdf
        run: |
          for mdfile in ${{ github.workspace }}/*.md; do
            mdfilebase=$(basename "$mdfile")
            docker run --rm -v "${{ github.workspace }}:/pandoc" pandoc/latex:latest \
              "/pandoc/$mdfilebase" -o "/pandoc/pdf/${mdfilebase%.*}.pdf" \
              --pdf-engine=xelatex --template=/pandoc/esn.latex
          done

      - name: Build the html files
        run: |
          for mdfile in ${{ github.workspace }}/*.md; do
            mdfilebase=$(basename "$mdfile")
            docker run --rm -v "${{ github.workspace }}:/pandoc" pandoc/latex:latest \
              "/pandoc/$mdfilebase" -o "/pandoc/html/${mdfilebase%.*}.html"
          done
          
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
